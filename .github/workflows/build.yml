name: Build IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Build .app (unsigned)
      run: |
        xcodebuild \
          -project external/ThreeOneOSFive.xcodeproj \
          -scheme 3105 \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO

    - name: Find built .app
      run: find build/Build/Products -name "*.app" -type d

    - name: Create IPA
      run: |
        APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 -type d | head -1)
        if [ -z "$APP_PATH" ]; then
          echo "ERROR: .app not found!"
          find build/Build/Products -type d
          exit 1
        fi
        echo "Found app: $APP_PATH"
        mkdir -p Payload
        cp -R "$APP_PATH" Payload/
        zip -r MOOD_TOOLS.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: MOOD_TOOLS-unsigned-ipa
        path: MOOD_TOOLS.ipa
        retention-days: 7
